# Cohort assignment for one partition_version, and the labels it fixes.
#
# Run it with:
#   aws codebuild start-build --project-name edge-ml-flywheel-partition
#
# To draw a different version:
#   aws codebuild start-build --project-name edge-ml-flywheel-partition \
#     --environment-variables-override name=PARTITION_VERSION,value=1,type=PLAINTEXT
#
# Same division of labour as `ingest.yml`: every decision about what the data
# is, and every copy to or from the bucket, goes through the package and
# `storage.ObjectStore` (docs/storage.md). No S3 key is written here; the
# commands derive their keys from `conventions`, so a copy cannot address a path
# the writer does not use. The package reads its bucket from
# `STORAGE_DATA_BUCKET`, which is this build's `DATA_BUCKET`.
#
# The seed is not an input. It is a property of `PARTITION_VERSION`, recorded in
# `conventions.PARTITIONS`, and there is no flag to override it.

version: 0.2

env:
  variables:
    WORK: /tmp/partition

    # Overridden by the project's environment (see infra/partition.tf) and
    # overridable again per build. Repeated here so the file runs on its own.
    PARTITION_VERSION: "0"

    # Pinned for `ingest.yml`'s reason: every step runs against exactly what the
    # install phase produced rather than against uv's sync semantics.
    UV_NO_SYNC: "1"

phases:
  install:
    commands:
      - curl -LsSf https://astral.sh/uv/0.11.25/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh

      # The `ingest` group, which is where `pyarrow` lives. Both data jobs read
      # and write parquet, so the group serves both. `run` is the AWS SDK, which
      # every copy below calls through the object store -- named rather than
      # left to arrive transitively through the dev group's `moto`, which is a
      # test dependency and no promise to a build.
      - uv sync --frozen --group ingest --group run
      - uv run python -c "import sys; print(sys.version)"

  pre_build:
    commands:
      - mkdir -p "$WORK/stage"

      # Prefixes out of the package, for the log. `prefix` writes to stdout and
      # logging to stderr, the way `ingest url` does.
      - MANIFEST_PREFIX=$(uv run python -m edge_ml_flywheel.partition prefix manifest)
      - PARTITION_PREFIX=$(uv run python -m edge_ml_flywheel.partition prefix partition --partition-version "$PARTITION_VERSION")
      - echo "reading $MANIFEST_PREFIX"
      - echo "writing $PARTITION_PREFIX"

      # The manifest, staged at the key it has in the bucket so the partitioner
      # finds it exactly where `conventions` says it is, and this version's
      # recorded draw if it has one. The record goes to $WORK rather than into
      # the staged tree, which is what gets uploaded. Absent is the ordinary
      # first run and leaves no file.
      - STORAGE_DATA_BUCKET="$DATA_BUCKET" uv run python -m edge_ml_flywheel.partition fetch-inputs --stage-dir "$WORK/stage" --recorded "$WORK/recorded.json" --partition-version "$PARTITION_VERSION"
      - ls -l "$WORK/stage/$MANIFEST_PREFIX"

      # The redraw guard. If this version has already been drawn, its recorded
      # seed, sizes and draw rule must be the ones in this commit -- the
      # assignments in the bucket are what every run keyed to this version was
      # measured against, so an edited seed here is a new version and not a
      # re-run of this one. A missing file is the first run.
      - uv run python -m edge_ml_flywheel.partition verify-recorded --recorded "$WORK/recorded.json" --partition-version "$PARTITION_VERSION"

  build:
    commands:
      # Reads the manifest, draws the cohorts, asserts the partition is disjoint
      # and complete, and writes both files. The assertion runs before either
      # file exists, so a failure here uploads nothing.
      - uv run python -m edge_ml_flywheel.partition assign --stage-dir "$WORK/stage" --partition-version "$PARTITION_VERSION"
      - ls -lR "$WORK/stage/$PARTITION_PREFIX"

      # The labels `bootstrap` and `eval` own. Three steps rather than one because
      # which documents to fetch is a function of the draw that just happened: the
      # package names them, fetches exactly what it named, and reads back only
      # that.
      #
      # `label-keys` reads the assignments off the staged tree, so the list is the
      # partition's own answer rather than a size arithmetic that could agree with
      # it by coincidence. It cannot name a `pool` label -- `cohort_labels.label_key`
      # raises on any cohort outside `LABELED_COHORTS` -- which makes this file the
      # audit artifact for what the widened `raw/labels/` grant was spent on.
      - uv run python -m edge_ml_flywheel.partition label-keys --stage-dir "$WORK/stage" --partition-version "$PARTITION_VERSION" > "$WORK/label-keys.txt"
      - echo "staging $(wc -l < "$WORK/label-keys.txt") label documents of the 80,000 this role can read"

      # One GET per document, which is what the archive's per-image JSON costs.
      # In the package rather than in a shell loop here, because 13,000 objects of
      # a few kilobytes are request latency and an `aws s3 cp` per object is a
      # Python interpreter per object -- which on this container's two vCPUs is
      # the whole cost and timed this build out at thirty minutes. `--recursive`
      # over the label prefix would be one command and would put all 80,000 on
      # local disk, including the 62,000 the oracle exists to sell.
      #
      # It derives the same list `label-keys` printed above rather than reading
      # that file, so nothing in the build can hand the downloader a key the
      # partition did not name. A document that fails to land fails the build,
      # rather than becoming a short label file below.
      - STORAGE_DATA_BUCKET="$DATA_BUCKET" uv run python -m edge_ml_flywheel.partition stage-labels --stage-dir "$WORK/stage" --partition-version "$PARTITION_VERSION"

      # Asserts each cohort's file holds exactly that cohort's images before
      # writing it. Same ordering as the draw above: nothing is uploaded by a run
      # whose checks did not pass.
      - uv run python -m edge_ml_flywheel.partition labels --stage-dir "$WORK/stage" --partition-version "$PARTITION_VERSION"
      - ls -lR "$WORK/stage/$PARTITION_PREFIX"

  post_build:
    commands:
      # post_build runs whether or not build succeeded, and this phase writes to
      # the bucket. This is the guard.
      - test "$CODEBUILD_BUILD_SUCCEEDING" = "1"

      # Only the partition prefix: the manifest and the label documents were
      # copied into the staged tree to be read, and writing either back is a
      # permission this role deliberately does not hold -- `raw/` is denied it by
      # the bucket policy whatever this copy addresses. The assignments, the
      # record and the two cohort label files all sit under the prefix.
      #
      # Then it reads the record back and makes `verify-recorded`'s comparison
      # against what landed: the document in the bucket now describes the
      # partition this commit draws.
      - STORAGE_DATA_BUCKET="$DATA_BUCKET" uv run python -m edge_ml_flywheel.partition upload --stage-dir "$WORK/stage" --partition-version "$PARTITION_VERSION"
