[project]
name = "edge-ml-flywheel"
version = "0.0.0"
description = "Closed-loop retraining and deployment pipeline for an edge perception model"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Project dependencies rather than a group, unlike `ingest` and `run` below.
# Those two are one job's needs; these are the pure-logic layer's, which the
# training container, the gate step and the test suite all import.
#
# `pycocotools` supplies the greedy IoU matching: a reimplementation is a few
# hundred lines of subtle code whose numbers compare to no published COCO
# result. `numpy` arrives with it transitively and is listed anyway, since every
# match-cache annotation in this layer is an `NDArray`.
dependencies = [
    "numpy>=2",
    "pycocotools>=2.0.8",
]

# One lockfile covers both the local test environment and the training
# container, and a lock resolves against requires-python. So this range tracks
# the container interpreter rather than this machine's: 3.12 is provisional
# until the training base image is chosen. Moving it is one line plus uv sync.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
  "F",   # pyflakes
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "I",   # import sorting
  "N",   # pep8 naming
  "UP",  # pyupgrade
  "B",   # bugbear
  "A",   # shadowed builtins
  "C4",  # comprehensions
  "SIM", # simplify
  "PTH", # use pathlib
  "PL",  # pylint subset
  "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on magic numbers by design; a known-answer bootstrap test is
# nothing but magic numbers. `verification/` is the same kind of file -- it
# exists to compare a real extract against literal expected counts -- it just
# needs 5.8 GB of BDD100K to run, so it sits outside `tests/`.
"tests/**" = ["PLR2004"]
"verification/**" = ["PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Strict over all of `src/`. Set globally rather than per package so a new
# package cannot arrive below the line unnoticed.
#
# `tests/` is out of scope: a test that builds a deliberately invalid row to
# assert it raises is a type error by design.
[tool.mypy]
files = ["src", "container"]
python_version = "3.12"
strict = true

# pyarrow ships no `py.typed` marker, so mypy refuses to look inside it and
# every import is an error rather than an unknown. Scoped to the one package
# that needs it rather than set globally: Pillow *is* typed, and a blanket
# `ignore_missing_imports` would silently accept the next dependency that is
# not. Revisit if pyarrow ever ships types -- `warn_unused_configs` reports
# this section as unused the moment nothing matches it.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

# Same situation as pyarrow: neither ships a `py.typed` marker. `boto3-stubs`
# exists and is deliberately not used -- it types a resource-level `Table` as
# `Any` regardless, since the resource API is generated at runtime from JSON
# service models, so the stubs would buy nothing for the one call shape this
# project makes and would pin a second package to the SDK version.
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

# The training container's two packages, which are deliberately not in the
# lockfile: they are installed by pip inside the prebuilt image from
# `container/requirements.txt`, against a torch build the image was assembled
# around. So they are absent locally by design rather than by omission, and the
# alternative to this override is a multi-gigabyte CUDA install in CI to type
# check one module. `entrypoint` is the only module that imports either.
[[tool.mypy.overrides]]
module = ["ultralytics.*", "torch.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8",
    "ruff>=0.16.2",
    # From typeshed rather than an `ignore_missing_imports` override: an untyped
    # `COCOeval` returns `Any`, and every match-array shape downstream of it then
    # type-checks against anything.
    "types-pycocotools>=2.0.0.20250809",
    # An in-process DynamoDB that honours condition expressions, which is the
    # one behaviour the registration depends on. A hand-rolled fake would be a
    # fake that returns whatever the test needs: the conditional put is the
    # module's whole reason to exist, so the thing under test is precisely
    # whether a real engine refuses the second write.
    "moto[dynamodb]>=5",
]

# A group rather than a project dependency, because these are the ingest
# container's needs and not the package's. The Phase 3 training image installs
# the same lockfile and has no reason to carry a parquet writer or an image
# decoder that only the one-shot data job uses.
#
# CI installs it anyway (`uv sync --frozen --group ingest`), so the ingest module
# is linted, typed and unit tested like everything else rather than being code
# that only ever runs in a place nobody watches.
ingest = [
    # Writes the manifest parquet. Chosen over a dataframe library because
    # writing 80,000 rows with one list column is the entire requirement.
    "pyarrow>=18",
    # Decodes images for the integrity checks, and specifically for `draft`,
    # which decodes a JPEG at 1/8 scale straight out of the DCT coefficients.
    "pillow>=11",
]

# The AWS SDK, for the one module that makes an API call. A group rather than a
# project dependency for `ingest`'s reason, and separate from it because the two
# jobs share nothing: registration writes one DynamoDB item and reads no parquet.
# `moto` brings boto3 transitively, so the dev group already has it and the test
# suite runs without this group installed.
run = [
    "boto3>=1.35",
]

# The operator's side of a training job: reading the labeled set out of parquet
# to write the image manifest, and the SageMaker and S3 calls that start the job.
# A group for `ingest`'s reason, and it holds neither `ultralytics` nor `torch` --
# those are the container's, installed by pip from `container/requirements.txt`
# inside an image that already carries a CUDA-matched torch. Nothing outside that
# container ever runs the model.
training = [
    "boto3>=1.35",
    "pyarrow>=18",
]
