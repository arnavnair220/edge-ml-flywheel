# The gpu pool: labeled and tainted as the cluster contract requires, and empty
# until a pod that tolerates the taint is pending.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu
spec:
  template:
    metadata:
      labels:
        pool: gpu
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      taints:
        - key: nvidia.com/gpu
          value: present
          effect: NoSchedule
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values:
            {{- toYaml .Values.instanceTypes | nindent 12 }}
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
  limits:
    nodes: {{ .Values.maxNodes | quote }}
  # Remove a node once it has run no pods for a minute: scale to zero.
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 1m
