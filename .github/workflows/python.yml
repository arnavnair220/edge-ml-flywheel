name: python

# Runs on pull requests, and again on main so the default branch is known-good
# even when a change lands without review. Branch protection is unavailable on
# a private repo on the free plan, so main is not otherwise guarded.
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "verification/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "verification/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/workflows/python.yml"

# No AWS here, so no id-token and nothing to assume.
permissions:
  contents: read

# Nothing in this workflow touches shared state, so superseding an in-flight run
# is free. The Terraform workflow deliberately does the opposite, because two
# runs must never reach state at once.
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact version because setup-uv publishes no floating major
      # tag: v9 does not resolve, only v9.0.0. Bump deliberately.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # --frozen installs strictly from uv.lock and fails if the lock and
      # pyproject.toml disagree, so a dependency edit without a re-lock is
      # caught here rather than by whoever syncs next. The interpreter comes
      # from .python-version, which uv downloads if the runner lacks it.
      #
      # --group ingest and --group run so that both CodeBuild-only modules are
      # linted, typed and unit tested here rather than only in the job that
      # runs them. Code whose only execution is inside a build is exactly the
      # code that needs checking somewhere cheaper. `run` is named explicitly
      # even though `moto` pulls boto3 in anyway -- a test dependency is not a
      # statement about what the job installs.
      - name: sync
        run: uv sync --frozen --group ingest --group run

      # --output-format=github annotates the offending lines in the PR diff
      # instead of burying them in log output.
      - name: lint
        run: uv run ruff check --output-format=github .

      - name: format
        run: uv run ruff format --check .

      # Scope and strictness live in pyproject.toml, so the editor and CI check
      # the same thing. Before the tests, because a type error is usually the
      # cheaper diagnosis of the same mistake.
      - name: types
        run: uv run mypy

      - name: test
        run: uv run pytest -q
