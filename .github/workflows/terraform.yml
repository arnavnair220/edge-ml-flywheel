name: terraform

# Plan on every pull request, apply only after a merge to main.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

# id-token: write is what lets the job request an OIDC token from GitHub.
# Without it the AWS login step fails and no credentials are issued.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.14.5

  # Terraform inputs. The four GitHub identity values come from the github
  # context, so a clone or fork needs no configuration for them at all.
  TF_VAR_github_owner: ${{ github.repository_owner }}
  TF_VAR_github_repo: ${{ github.event.repository.name }}
  TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
  TF_VAR_github_repo_id: ${{ github.repository_id }}

  # These two are deployment-specific and must be set as repository variables
  # under Settings > Secrets and variables > Actions > Variables.
  TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
  TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}

# Never let two runs touch state at once. The S3 lock would reject the second
# one anyway; this makes it queue instead of fail.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      # An unset repository variable resolves to an empty string, which fails
      # later as an opaque "Not authorized" error. Fail here with a real message.
      - name: check required repository variables
        run: |
          missing=""
          [ -n "${{ vars.AWS_ACCOUNT_ID }}" ] || missing="$missing AWS_ACCOUNT_ID"
          [ -n "${{ vars.TF_STATE_BUCKET }}" ] || missing="$missing TF_STATE_BUCKET"
          [ -n "${{ vars.AWS_PLAN_ROLE_ARN }}" ] || missing="$missing AWS_PLAN_ROLE_ARN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "Set them under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: validate
        run: terraform validate

      - name: plan
        run: terraform plan -input=false -no-color -lock-timeout=5m

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: check required repository variables
        run: |
          missing=""
          [ -n "${{ vars.AWS_ACCOUNT_ID }}" ] || missing="$missing AWS_ACCOUNT_ID"
          [ -n "${{ vars.TF_STATE_BUCKET }}" ] || missing="$missing TF_STATE_BUCKET"
          [ -n "${{ vars.AWS_APPLY_ROLE_ARN }}" ] || missing="$missing AWS_APPLY_ROLE_ARN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing"
            echo "Set them under Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: apply
        run: terraform apply -auto-approve -input=false -lock-timeout=5m
