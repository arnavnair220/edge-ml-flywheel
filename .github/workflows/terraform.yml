name: terraform

# Plan on every pull request, apply only after a merge to main.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

# id-token: write is what lets the job request an OIDC token from GitHub.
# Without it the AWS login step fails and no credentials are issued.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.14.5
  PLAN_ROLE: arn:aws:iam::339741260621:role/edge-ml-flywheel-gha-plan
  APPLY_ROLE: arn:aws:iam::339741260621:role/edge-ml-flywheel-gha-apply

# Never let two runs touch state at once. The S3 lock would reject the second
# one anyway; this makes it queue instead of fail.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.PLAN_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: fmt
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init -input=false

      - name: validate
        run: terraform validate

      - name: plan
        run: terraform plan -input=false -no-color -lock-timeout=5m

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.APPLY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: init
        run: terraform init -input=false

      - name: apply
        run: terraform apply -auto-approve -input=false -lock-timeout=5m
