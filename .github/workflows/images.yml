name: images

# Builds every job image on pull requests and checks that each one starts. On a
# merge into the refactor branch, the same images are pushed to GHCR. The image
# list is docker-bake.hcl's; this workflow reads it rather than repeating it.
on:
  pull_request:
    paths:
      - "images/**"
      - "src/**"
      - "container/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - ".dockerignore"
      - "docker-bake.hcl"
      - ".github/workflows/images.yml"
  push:
    branches: [refactor/kubernetes-platform]
    paths:
      - "images/**"
      - "src/**"
      - "container/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - ".dockerignore"
      - "docker-bake.hcl"
      - ".github/workflows/images.yml"

permissions:
  contents: read

# A superseded PR build is safe to cancel. A push build is not, so a merge
# never leaves some images pushed and others not.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  TAG: ${{ github.sha }}

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "images=$(docker buildx bake --print 2>/dev/null | jq -c '.group.default.targets')" >> "$GITHUB_OUTPUT"

  # One runner per image: the GPU images do not fit on one runner's disk together.
  build:
    needs: targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.targets.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      # The GPU images carry several gigabytes of CUDA libraries, more than a
      # runner's free disk holds alongside the build cache.
      - name: free disk
        if: matrix.image == 'train' || matrix.image == 'score'
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - name: build
        uses: docker/bake-action@v6
        with:
          source: .
          targets: ${{ matrix.image }}
          load: true
          set: |
            *.cache-from=type=gha,scope=${{ matrix.image }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.image }}

      # The smoke check: the container starts, imports its job, and prints usage.
      - name: smoke
        run: docker run --rm "$REGISTRY/${{ matrix.image }}:$TAG" --help

      - name: log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push
        if: github.event_name == 'push'
        run: docker push "$REGISTRY/${{ matrix.image }}:$TAG"
